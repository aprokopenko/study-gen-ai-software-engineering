services:
  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
      - ./data:/var/www/data

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
